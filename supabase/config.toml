# Local development only; hosted Auth settings must be set separately.
project_id = "family-splitter"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# The CLI maps this flag to the email-provider switch; keep it enabled for OTP.
# auth.enable_signup above is the public signup gate and remains false.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.sms]
enable_signup = false
